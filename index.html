let records=[],active="전체",userPos=null,favOnly=false;
let favorites=new Set(JSON.parse(localStorage.getItem("seaFavorites")||"[]"));
document.getElementById("chips").innerHTML=REGIONS.map((x,i)=>`<button class="chip ${i===0?"active":""}" onclick="setRegion('${x}',this)">${x}</button>`).join("");
function setRegion(x,el){active=x;favOnly=false;document.querySelectorAll(".chip").forEach(e=>e.classList.remove("active"));el.classList.add("active");render()}
function hav(a,b,c,d){const R=6371,q=Math.PI/180,da=(c-a)*q,do_=(d-b)*q;return 2*R*Math.asin(Math.sqrt(Math.sin(da/2)**2+Math.cos(a*q)*Math.cos(c*q)*Math.sin(do_/2)**2))}
function judge(r){if(r.temp==null||r.wave==null)return{text:"확인 필요",cls:"unknown",score:-99};let s=50+(r.temp-22)*8-r.wave*24-(r.wind||0)*1.2-(r.rain||0)*2; if(r.uv>8)s-=8;s=Math.max(0,Math.min(100,Math.round(s)));if(r.temp>=24&&r.wave<=.5&&r.wind<=6)return{text:"아기 물놀이 추천",cls:"good",score:s};if(r.temp>=22&&r.wave<=.8&&r.wind<=9)return{text:"짧게 가능",cls:"warn",score:s};return{text:"오늘은 비추천",cls:"bad",score:s}}

function toggleFavView(){favOnly=!favOnly;active="전체";render();document.getElementById("count").textContent+=(favOnly?" · 즐겨찾기":"")}
function getLocation(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude};records.forEach(r=>r.distance=hav(userPos.lat,userPos.lon,r.lat,r.lon));document.getElementById("sort").value="distance";render()},()=>alert("위치 권한을 허용해 주세요.")):alert("이 브라우저는 위치 기능을 지원하지 않습니다.")}
function openDetail(name){let r=records.find(x=>x.name===name);if(!r)return;let vals=(r.tempTrend||[]).filter(x=>x!=null),mn=Math.min(...vals,15),mx=Math.max(...vals,30);let bars=(r.tempTrend||[]).map((v,i)=>`<div class="barWrap"><div>${v==null?"":v.toFixed(0)+"°"}</div><div class="bar" style="height:${v==null?3:20+(v-mn)/(Math.max(1,mx-mn))*80}px"></div><div>${i%4===0?i*6+"h":""}</div></div>`).join("");document.getElementById("sheet").innerHTML=`<div class="sheetHead"><div><h2 style="margin:0">${r.name}</h2><small>${r.region} · ${r.area}</small></div><button class="close" onclick="closeModal()">닫기</button></div><h3>3일 수온 변화</h3><div class="chart">${bars}</div><div class="detailGrid"><div class="dbox"><small>현재 수온</small><br><b>${fmt(r.temp,"℃")}</b></div><div class="dbox"><small>파고</small><br><b>${fmt(r.wave,"m")}</b></div><div class="dbox"><small>바람</small><br><b>${fmt(r.wind,"m/s")}</b></div><div class="dbox"><small>오늘 UV 최대</small><br><b>${r.uv??"--"}</b></div><div class="dbox"><small>강수</small><br><b>${fmt(r.rain,"mm")}</b></div><div class="dbox"><small>추천 점수</small><br><b>${judge(r).score}점</b></div></div><a class="mapbtn" target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent(r.name+" 해수욕장")}">네이버 지도에서 보기</a>`;document.getElementById("modal").style.display="block"}
function closeModal(){document.getElementById("modal").style.display="none"}
async function fetchBatch(batch){
 const lats=batch.map(x=>x.lat).join(","),lons=batch.map(x=>x.lon).join(",");
 const mu=new URL("https://marine-api.open-meteo.com/v1/marine");mu.search=new URLSearchParams({latitude:lats,longitude:lons,hourly:"wave_height,wave_period,sea_surface_temperature",timezone:"Asia/Seoul",forecast_days:"3",cell_selection:"sea"});
 const wu=new URL("https://api.open-meteo.com/v1/forecast");wu.search=new URLSearchParams({latitude:lats,longitude:lons,current:"wind_speed_10m,precipitation",daily:"uv_index_max",timezone:"Asia/Seoul",forecast_days:"3",wind_speed_unit:"ms"});
 const [mr,wr]=await Promise.all([fetch(mu),fetch(wu)]);if(!mr.ok||!wr.ok)throw Error("API");let m=await mr.json(),w=await wr.json();m=Array.isArray(m)?m:[m];w=Array.isArray(w)?w:[w];
 return batch.map((b,i)=>{let mm=m[i],ww=w[i],now=Date.now(),idx=0,d=Infinity;(mm.hourly?.time||[]).forEach((t,k)=>{let x=Math.abs(new Date(t).getTime()-now);if(x<d){d=x;idx=k}});return {...b,temp:mm.hourly?.sea_surface_temperature?.[idx]??null,wave:mm.hourly?.wave_height?.[idx]??null,period:mm.hourly?.wave_period?.[idx]??null,wind:ww.current?.wind_speed_10m??null,rain:ww.current?.precipitation??null,uv:ww.daily?.uv_index_max?.[0]??null,tempTrend:(mm.hourly?.sea_surface_temperature||[]).filter((_,k)=>k%6===0).slice(0,12),distance:userPos?hav(userPos.lat,userPos.lon,b.lat,b.lon):null}})}
async function loadAll(){document.getElementById("error").style.display="none";try{let chunks=[];for(let i=0;i<BEACHES.length;i+=15)chunks.push(BEACHES.slice(i,i+15));let all=await Promise.all(chunks.map(fetchBatch));records=all.flat();localStorage.setItem("seaCacheV2",JSON.stringify({t:Date.now(),records}));render();updateTop();notifyCold()}catch(e){let er=document.getElementById("error");er.style.display="block";er.textContent="데이터를 불러오지 못했습니다. 잠시 후 새로고침하거나 공식 해양정보를 확인해 주세요."}}
function notifyCold(){if(Notification.permission!=="granted")return;let cold=records.filter(r=>favorites.has(r.name)&&r.temp!=null&&r.temp<22);if(cold.length)new Notification("즐겨찾기 해변 저수온 주의",{body:cold.map(x=>`${x.name} ${x.temp.toFixed(1)}℃`).join(", ")})}
try{let c=JSON.parse(localStorage.getItem("seaCacheV2"));if(c?.records){records=c.records;render();updateTop()}}catch(e){}
loadAll();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
